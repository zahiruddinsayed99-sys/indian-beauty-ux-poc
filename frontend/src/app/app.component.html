<div class="min-h-screen bg-gray-50 dark:bg-gray-900 flex flex-col font-sans text-gray-900 dark:text-gray-100 transition-colors duration-300">

  <div class="bg-primary-600 text-white font-bold text-sm py-2 px-4 flex justify-between items-center shadow-md relative z-10">
    <h1 class="text-xl tracking-wide"><a routerLink="/">Indian Beauty Store</a></h1>
    <div class="flex gap-4 items-center">
      <a routerLink="/" class="hover:text-primary-200 transition-colors">Shop</a>
      <a routerLink="/cart" class="hover:text-primary-200 transition-colors flex items-center gap-1" [matBadge]="cart.totalItems()" [matBadgeHidden]="cart.totalItems() === 0" matBadgeColor="warn">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      </a>

      <div class="flex items-center gap-2 ml-4 border-l border-primary-400 pl-4">
        <button (click)="themeService.toggleDarkMode()" class="hover:text-primary-200 transition-colors">
          <span *ngIf="!themeService.isDarkMode()">🌙</span>
          <span *ngIf="themeService.isDarkMode()">☀️</span>
        </button>

        <div class="flex items-center gap-1">
          <button (click)="themeService.setThemeColor('pink')" class="w-4 h-4 rounded-full bg-pink-500 border border-white shadow-sm hover:scale-110 transition-transform"></button>
          <button (click)="themeService.setThemeColor('violet')" class="w-4 h-4 rounded-full bg-violet-500 border border-white shadow-sm hover:scale-110 transition-transform"></button>
          <button (click)="themeService.setThemeColor('teal')" class="w-4 h-4 rounded-full bg-teal-500 border border-white shadow-sm hover:scale-110 transition-transform"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-primary-100 p-2 text-center text-xs font-bold text-primary-800 shadow-inner relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-r from-primary-600 to-primary-500 opacity-20" style="width: 30%;"></div>
    <span class="relative z-10">✨ 30% - Welcome Kit Unlocked! ✨</span>
  </div>

  <main class="flex-grow p-4 md:p-8">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-gray-800 dark:bg-gray-950 text-gray-400 text-center py-6 text-sm transition-colors duration-300">
    &copy; 2023 Indian Beauty Store
  </footer>
</div>
